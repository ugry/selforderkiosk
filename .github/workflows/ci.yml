name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # NOTE: tests are E2E (uvicorn + Postgres + Playwright). Until the full
      # E2E harness is wired (devops), CI gates on syntax + test collection.
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: python -m py_compile app/*.py
      - run: python -m pytest tests --collect-only -q
